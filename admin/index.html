<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aftekenboek — beheer</title>
<style>
  :root {
    --bg: #f4f5f3; --card: #fff; --border: #e1e3df; --text: #161a17;
    --dim: #5a605b; --accent: #14445f; --on-accent: #fff; --good: #1b6b3a;
    --warn: #8a5a00; --danger: #b3261e; --chip: #ebede9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101210; --card: #1b1e1c; --border: #2c302d; --text: #f1f3f0;
      --dim: #9ba29d; --accent: #7fb2cf; --on-accent: #101210; --good: #6fd397;
      --warn: #e0b252; --danger: #f2b8b5; --chip: #262a27;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--card);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 17px; margin: 0; }
  header .who { color: var(--dim); font-size: 13px; margin-left: auto; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button {
    background: none; border: 0; color: var(--dim); padding: 8px 12px;
    border-radius: 8px; cursor: pointer; font: inherit; font-weight: 600;
  }
  nav button[aria-current="true"] { background: var(--chip); color: var(--text); }
  main { padding: 24px; max-width: 1000px; margin: 0 auto; }
  h2 { font-size: 20px; margin: 0 0 4px; }
  h3 { font-size: 15px; margin: 24px 0 8px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; margin-bottom: 12px;
  }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .spread { justify-content: space-between; }
  .grow { flex: 1; min-width: 180px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--dim); margin-bottom: 4px; }
  input, select, textarea {
    width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 9px;
    background: var(--bg); color: var(--text); font: inherit;
  }
  textarea { min-height: 72px; resize: vertical; }
  button.btn {
    padding: 9px 14px; border-radius: 9px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--on-accent); font: inherit;
    font-weight: 600; cursor: pointer;
  }
  button.ghost { background: none; border-color: var(--border); color: var(--text); }
  button.danger { background: none; border-color: var(--border); color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  .dim { color: var(--dim); font-size: 13px; }
  .chip {
    display: inline-block; background: var(--chip); color: var(--dim);
    border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600;
  }
  button.chip { border: 0; cursor: pointer; font-family: inherit; padding: 5px 12px; }
  button.chip.on { background: var(--accent); color: var(--on-accent); }
  .note {
    border-left: 3px solid var(--warn); background: var(--card);
    padding: 12px 14px; border-radius: 0 10px 10px 0; margin-bottom: 16px; font-size: 13px;
  }
  .err { border-left-color: var(--danger); color: var(--danger); }
  .ok { border-left-color: var(--good); color: var(--good); }
  details { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; }
  details summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--accent); }
  .part { display: flex; gap: 8px; align-items: center; margin: 6px 0 0 16px; }
  .part input { flex: 1; }
  .num { width: 62px; flex: none; }
  #signin { max-width: 380px; margin: 12vh auto; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="signin">
  <div class="card">
    <h2>Aftekenboek</h2>
    <p class="dim" id="signin-lead">Beheerpagina. Log in met je account.</p>

    <div id="name-row" class="hidden" style="margin-top:12px"><label for="name">Naam</label>
      <input id="name" type="text" autocomplete="name" placeholder="Voor- en achternaam"></div>
    <div style="margin-top:12px"><label for="email">E-mailadres</label>
      <input id="email" type="email" autocomplete="username"></div>
    <div style="margin-top:12px"><label for="password">Wachtwoord</label>
      <input id="password" type="password" autocomplete="current-password"></div>

    <div id="signin-error" class="note err hidden" style="margin-top:12px"></div>
    <div id="signin-ok" class="note ok hidden" style="margin-top:12px"></div>

    <button class="btn" id="signin-btn" style="margin-top:16px; width:100%">Inloggen</button>
    <button class="btn ghost" id="mode-btn" style="margin-top:8px; width:100%">
      Nog geen account? Maak er een
    </button>
  </div>
</div>

<!-- Wie is ingelogd maar nog nergens bij hoort. Een account op zichzelf geeft
     nergens toegang toe; de code doet dat. -->
<div id="join" class="hidden">
  <div class="card">
    <h2>Code invullen</h2>
    <p class="dim">
      Je account staat klaar. Vul de code van zes tekens in die je van je groep
      kreeg, dan hoor je erbij.
    </p>
    <div style="margin-top:12px"><label for="code">Code</label>
      <input id="code" type="text" maxlength="8" autocapitalize="characters"
             style="font-size:22px; letter-spacing:4px; text-align:center"></div>
    <div id="join-error" class="note err hidden" style="margin-top:12px"></div>
    <button class="btn" id="join-btn" style="margin-top:16px; width:100%">Aanmelden bij groep</button>
    <button class="btn ghost" id="join-signout" style="margin-top:8px; width:100%">Uitloggen</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>Aftekenboek — beheer</h1>
    <nav>
      <button data-tab="leden" aria-current="true">Leden</button>
      <button data-tab="codes">Codes</button>
      <button data-tab="speltakken">Speltakken</button>
      <button data-tab="bakken">Bakken</button>
      <button data-tab="catalogus">Diploma's en eisen</button>
    </nav>
    <span class="who" id="who"></span>
    <button class="btn ghost" id="signout">Uitloggen</button>
  </header>
  <!-- Buiten #view, want dat wordt bij elke render leeggegooid en dan zou een
       "Opgeslagen" verdwijnen op het moment dat je hem nodig hebt. -->
  <div style="max-width:1000px; margin:16px auto 0; padding:0 24px">
    <div id="say" class="note hidden"></div>
  </div>
  <main id="view"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<!-- Relatief, niet /config.js: gehost onder scoutingjwf.nl/beheer/ zou een
     absoluut pad bij de WordPress-root uitkomen en een 404 opleveren. -->
<script src="config.js"></script>
<script>
/*
 * De beheerpagina.
 *
 * Vanilla JS met opzet: dit is één bestand dat je opent en dat het doet, zonder
 * build en zonder node_modules. De regels over wie wat mag staan niet hier maar
 * in de database — deze pagina praat met precies dezelfde policies als de app,
 * met de publishable key. Wie geen beheerder is, krijgt hier dus ook niets voor
 * elkaar, hoe hard hij ook op de knoppen drukt.
 */

const cfg = window.AFTEKENBOEK ?? { url: '', key: '' };
const db = cfg.url && cfg.key ? window.supabase.createClient(cfg.url, cfg.key) : null;

let me = null;       // { id, name, email }
let group = null;    // { id, name } — de groep waar je beheerder van bent
let tab = 'leden';

// ---------------------------------------------------------------- helpers

/**
 * Supabase gooit geen Error maar een gewoon object, dus String() erop geeft
 * "[object Object]". Zelfde reden als in de app: kijk naar de vorm.
 */
function message(e) {
  if (!e) return '';
  if (typeof e === 'string') return e;
  if (e instanceof Error && e.message) return e.message;
  const parts = [e.message, e.details, e.hint].filter((p) => typeof p === 'string' && p.trim());
  if (parts.length) return parts.join(' — ');
  try { return JSON.stringify(e); } catch { return 'Onbekende fout'; }
}

function el(tag, props, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props ?? {})) {
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return node;
}

function field(label, value, attrs = {}) {
  const input = el(attrs.multiline ? 'textarea' : 'input', {
    value: attrs.multiline ? null : (value ?? ''),
    type: attrs.type ?? 'text',
    class: attrs.class ?? null,
  });
  if (attrs.multiline) input.value = value ?? '';
  return { wrap: el('div', { class: attrs.wrapClass ?? 'grow' }, el('label', {}, label), input), input };
}

let noteTimer = null;
function say(text, kind = 'ok') {
  const bar = document.getElementById('say');
  bar.className = `note ${kind}`;
  bar.textContent = text;
  bar.classList.remove('hidden');
  clearTimeout(noteTimer);
  if (kind === 'ok') noteTimer = setTimeout(() => bar.classList.add('hidden'), 3000);
}

async function run(fn, okText) {
  try {
    const out = await fn();
    if (okText) say(okText, 'ok');
    return out;
  } catch (e) {
    say(message(e), 'err');
    throw e;
  }
}

function check(res) {
  if (res.error) throw res.error;
  return res.data;
}

function confirmed(text) {
  return window.confirm(text);
}

/** Een aan/uit-pil. Zelfde ding als de Chip in de app. */
function chip(label, on, onclick) {
  return el('button', { class: `chip${on ? ' on' : ''}`, onclick }, label);
}

function sectionsOf(group) {
  return db.from('sections').select('*').eq('group_id', group.id)
    .order('sort_order').order('name').then(check);
}

// ---------------------------------------------------------------- inloggen

/** 'in' = inloggen, 'up' = account maken. */
let authMode = 'in';

function paintAuthMode() {
  const up = authMode === 'up';
  document.getElementById('name-row').classList.toggle('hidden', !up);
  document.getElementById('signin-lead').textContent = up
    ? 'Maak een account. Daarna vul je de code in die je van je groep kreeg.'
    : 'Beheerpagina. Log in met je account.';
  document.getElementById('signin-btn').textContent = up ? 'Account maken' : 'Inloggen';
  document.getElementById('mode-btn').textContent = up
    ? 'Ik heb al een account'
    : 'Nog geen account? Maak er een';
  document.getElementById('password').setAttribute(
    'autocomplete', up ? 'new-password' : 'current-password');
  document.getElementById('signin-error').classList.add('hidden');
  document.getElementById('signin-ok').classList.add('hidden');
}

document.getElementById('mode-btn').addEventListener('click', () => {
  authMode = authMode === 'in' ? 'up' : 'in';
  paintAuthMode();
});

document.getElementById('signin-btn').addEventListener('click', async () => {
  const box = document.getElementById('signin-error');
  const okBox = document.getElementById('signin-ok');
  box.classList.add('hidden');
  okBox.classList.add('hidden');

  if (!db) {
    box.textContent = 'Geen verbinding ingesteld. Draai deze pagina via "npm run admin", dan leest hij de .env van het project.';
    box.classList.remove('hidden');
    return;
  }

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (authMode === 'up') {
    const naam = document.getElementById('name').value.trim();
    if (naam.length < 2) {
      box.textContent = 'Vul je naam in.';
      box.classList.remove('hidden');
      return;
    }
    const { data, error } = await db.auth.signUp({
      email,
      password,
      options: {
        data: { full_name: naam },
        // Anders gebruikt Supabase de Site URL uit het dashboard, en die staat
        // standaard op localhost:3000. Dit stuurt de bevestigingslink terug naar
        // deze pagina, waar hij ook vandaan kwam — lokaal of gehost, allebei goed.
        emailRedirectTo: location.href.split('#')[0].split('?')[0],
      },
    });
    if (error) {
      box.textContent = message(error);
      box.classList.remove('hidden');
      return;
    }
    // Staat "bevestig je e-mailadres" aan in Supabase, dan is er nog geen
    // sessie en moet er eerst een mailtje beantwoord worden.
    if (!data.session) {
      okBox.textContent = 'Je account is aangemaakt. Bevestig je e-mailadres en log daarna in.';
      okBox.classList.remove('hidden');
      authMode = 'in';
      paintAuthMode();
      okBox.classList.remove('hidden');
      return;
    }
  } else {
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) {
      box.textContent = message(error);
      box.classList.remove('hidden');
      return;
    }
  }

  await start();
});

document.getElementById('join-btn').addEventListener('click', async () => {
  const box = document.getElementById('join-error');
  box.classList.add('hidden');
  try {
    check(await db.rpc('redeem_invite', {
      p_code: document.getElementById('code').value.trim().toUpperCase(),
    }));
  } catch (e) {
    box.textContent = message(e);
    box.classList.remove('hidden');
    return;
  }
  document.getElementById('join').classList.add('hidden');
  await start();
});

document.getElementById('join-signout').addEventListener('click', async () => {
  await db.auth.signOut();
  location.reload();
});

document.getElementById('signout').addEventListener('click', async () => {
  await db.auth.signOut();
  location.reload();
});

for (const btn of document.querySelectorAll('nav button')) {
  btn.addEventListener('click', () => {
    tab = btn.dataset.tab;
    for (const b of document.querySelectorAll('nav button')) {
      b.setAttribute('aria-current', String(b === btn));
    }
    render();
  });
}

async function start() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) return;

  const profile = check(
    await db.from('profiles').select('id, full_name').eq('id', user.id).maybeSingle(),
  );
  me = { id: user.id, name: profile?.full_name ?? '', email: user.email };

  const rows = check(
    await db
      .from('memberships')
      .select('group_id, role, groups(id, name)')
      .eq('profile_id', user.id),
  );
  // Drie situaties, en ze lopen makkelijk door elkaar: nergens bij horen,
  // ergens bij horen maar geen beheerder zijn, en beheerder zijn.
  document.getElementById('signin').classList.add('hidden');

  if (rows.length === 0) {
    document.getElementById('join').classList.remove('hidden');
    return;
  }

  const admin = rows.find((r) => r.role === 'beheerder');
  if (!admin) {
    const waar = rows[0].groups?.name ?? 'je groep';
    document.getElementById('join').classList.add('hidden');
    document.getElementById('signin').classList.remove('hidden');
    document.getElementById('signin').innerHTML =
      `<div class="card"><h2>Je zit erin</h2>` +
      `<p class="dim">Je account hoort bij ${waar}. Deze beheerpagina is voor beheerders; ` +
      `voor aftekenen en leden toevoegen gebruik je de app.</p>` +
      `<p class="dim">Moet je hier wél bij kunnen, vraag een beheerder om je die rol te geven.</p></div>`;
    return;
  }

  document.getElementById('join').classList.add('hidden');
  group = { id: admin.groups.id, name: admin.groups.name };

  document.getElementById('signin').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('who').textContent = `${me.name || me.email} · ${group.name}`;
  render();
}

// ---------------------------------------------------------------- schermen

function render() {
  const view = document.getElementById('view');
  view.innerHTML = '';
  if (tab === 'leden') renderLeden(view);
  else if (tab === 'codes') renderCodes(view);
  else if (tab === 'speltakken') renderSpeltakken(view);
  else if (tab === 'bakken') renderBakken(view);
  else renderCatalogus(view);
}

// ---- Leden

async function renderLeden(view) {
  view.append(el('h2', {}, 'Leden'));
  view.append(el('p', { class: 'dim' },
    'Een vaarder hoeft geen telefoon of account te hebben om hier te staan. Haal je iemand uit de groep, dan verliest hij zijn plek in de lijst maar niet zijn aftekeningen.'));

  const nieuw = field('Naam', '', {});
  view.append(el('div', { class: 'card row' }, nieuw.wrap,
    el('button', {
      class: 'btn',
      onclick: async () => {
        if (nieuw.input.value.trim().length < 2) return;
        await run(async () => check(await db.rpc('add_member', {
          p_group: group.id, p_name: nieuw.input.value.trim(),
        })), 'Lid toegevoegd');
        render();
      },
    }, 'Lid toevoegen')));

  const [rows, sections] = await Promise.all([
    run(async () => check(await db.rpc('group_members', { p_group: group.id }))),
    sectionsOf(group),
  ]);

  // Filter op speltak, zodat een instructeur met twintig namen alleen zijn
  // eigen ploeg hoeft te zien.
  let filter = null;
  const list = el('div', {});
  const filterRow = el('div', { class: 'row', style: 'margin-bottom:12px' });

  function paintFilter() {
    filterRow.innerHTML = '';
    if (!sections.length) return;
    filterRow.append(chip('Alle', filter === null, () => { filter = null; paint(); }));
    for (const s of sections) {
      filterRow.append(chip(s.name, filter === s.id, () => {
        filter = filter === s.id ? null : s.id;
        paint();
      }));
    }
  }

  function paint() {
    paintFilter();
    list.innerHTML = '';
    const shown = filter ? rows.filter((m) => (m.section_ids ?? []).includes(filter)) : rows;
    if (!shown.length) list.append(el('p', { class: 'dim' }, 'Niemand in deze speltak.'));
    for (const m of shown) list.append(memberCard(m, sections));
  }

  view.append(filterRow, list);
  paint();
  return;

  function memberCard(m, sections) {
    const card = el('div', { class: 'card' });
    const select = el('select', {});
    for (const r of ['lid', 'instructeur', 'beheerder']) {
      const opt = el('option', { value: r }, { lid: 'Lid', instructeur: 'Instructeur', beheerder: 'Beheerder' }[r]);
      if (m.role === r) opt.selected = true;
      select.append(opt);
    }
    select.addEventListener('change', async () => {
      await run(async () => {
        check(await db.from('memberships').update({ role: select.value })
          .eq('group_id', group.id).eq('profile_id', m.profile_id));
      }, 'Rol aangepast');
      render();
    });

    // Naam als invoerveld: wie niet inlogt kan zijn eigen naam nooit
    // rechtzetten, dus moet iemand anders dat hier kunnen.
    const naam = el('input', { value: m.full_name });
    const bewaar = el('button', {
      class: 'btn ghost',
      onclick: async () => {
        if (naam.value.trim().length < 2) return;
        await run(async () => check(await db.rpc('set_member_name', {
          p_group: group.id, p_profile: m.profile_id, p_name: naam.value.trim(),
        })), 'Naam opgeslagen');
        render();
      },
    }, 'Naam opslaan');

    card.append(el('div', { class: 'row spread' },
      el('div', { class: 'grow' },
        el('div', { class: 'row' },
          naam,
          bewaar,
          m.profile_id === me.id ? el('span', { class: 'chip' }, 'jij') : null,
        ),
        el('div', { class: 'dim', style: 'margin-top:6px' },
          `${m.in_progress} in opleiding${m.awarded ? ` · ${m.awarded} behaald` : ''}` +
          (m.sections?.length ? ` · ${m.sections.join(', ')}` : '')),
      ),
      el('div', { class: 'row' },
        el('div', { style: 'width:150px' }, select),
        el('button', {
          class: 'btn danger',
          onclick: async () => {
            if (!confirmed(`${m.full_name || 'Dit lid'} uit de groep halen?\n\nWat al afgetekend is blijft bewaard.`)) return;
            await run(async () => {
              check(await db.rpc('remove_member', { p_group: group.id, p_profile: m.profile_id }));
            }, 'Uit de groep gehaald');
            render();
          },
        }, 'Verwijderen'),
      ),
    ));

    if (sections.length) {
      const chips = el('div', { class: 'row', style: 'margin-top:10px; gap:6px' },
        el('span', { class: 'dim', style: 'margin-right:4px' }, 'Speltakken:'));
      for (const s of sections) {
        const on = (m.section_ids ?? []).includes(s.id);
        chips.append(chip(s.name, on, async () => {
          // De hele set gaat mee, niet het verschil — zo kan er niets
          // halverwege blijven hangen.
          const next = on
            ? (m.section_ids ?? []).filter((id) => id !== s.id)
            : [...(m.section_ids ?? []), s.id];
          await run(async () => check(await db.rpc('set_member_sections', {
            p_group: group.id, p_profile: m.profile_id, p_sections: next,
          })), 'Speltakken bijgewerkt');
          render();
        }));
      }
      card.append(chips);
    }

    return card;
  }
}

// ---- Codes

async function renderCodes(view) {
  view.append(el('h2', {}, 'Uitnodigingscodes'));

  const sections = await sectionsOf(group);

  const role = el('select', {}, el('option', { value: 'lid' }, 'Lid'),
    el('option', { value: 'instructeur' }, 'Instructeur'));
  const label = field('Waarvoor (optioneel)', '', {});
  const uses = el('select', {}, el('option', { value: '1' }, 'Eén keer te gebruiken'),
    el('option', { value: '50' }, 'Voor een hele groep'));

  // Een code met een speltak zet nieuwe leden er meteen in, zodra ze hem
  // invullen. Dat scheelt nalopen wie waar hoort.
  const speltak = el('select', {}, el('option', { value: '' }, 'Geen speltak'));
  for (const s of sections) speltak.append(el('option', { value: s.id }, s.name));

  view.append(el('div', { class: 'card' },
    el('div', { class: 'row' },
      el('div', { class: 'grow' }, el('label', {}, 'Wordt'), role),
      sections.length
        ? el('div', { class: 'grow' }, el('label', {}, 'Komt in speltak'), speltak)
        : null,
      label.wrap,
      el('div', { class: 'grow' }, el('label', {}, 'Geldigheid'), uses),
      el('button', {
        class: 'btn',
        onclick: async () => {
          await run(async () => {
            const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 6; i++) code += alphabet[Math.floor(Math.random() * alphabet.length)];
            check(await db.from('invites').insert({
              group_id: group.id, code, role: role.value,
              label: label.input.value.trim() || null, max_uses: Number(uses.value),
              section_id: speltak.value || null,
            }));
          }, 'Code gemaakt');
          render();
        },
      }, 'Code maken'),
    )));

  const invites = check(await db.from('invites').select('*').eq('group_id', group.id)
    .order('created_at', { ascending: false }));

  if (!invites.length) view.append(el('p', { class: 'dim' }, 'Nog geen codes.'));

  for (const inv of invites) {
    view.append(el('div', { class: 'card row spread' },
      el('div', {},
        el('strong', { style: 'letter-spacing:3px; font-size:18px' }, inv.code),
        el('div', { class: 'dim' },
          `${inv.role}` +
          (inv.section_id ? ` · ${sections.find((s) => s.id === inv.section_id)?.name ?? 'speltak'}` : '') +
          `${inv.label ? ` · ${inv.label}` : ''} · ${inv.uses} van ${inv.max_uses} gebruikt`)),
      el('button', {
        class: 'btn danger',
        onclick: async () => {
          await run(async () => check(await db.from('invites').delete().eq('id', inv.id)), 'Ingetrokken');
          render();
        },
      }, 'Intrekken'),
    ));
  }
}

// ---- Speltakken

async function renderSpeltakken(view) {
  view.append(el('h2', {}, 'Speltakken'));

  const naam = field('Naam', '', {});
  view.append(el('div', { class: 'card row' }, naam.wrap,
    el('button', {
      class: 'btn',
      onclick: async () => {
        if (naam.input.value.trim().length < 2) return;
        await run(async () => check(await db.from('sections')
          .insert({ group_id: group.id, name: naam.input.value.trim() })), 'Toegevoegd');
        render();
      },
    }, 'Toevoegen')));

  const sections = check(await db.from('sections').select('*').eq('group_id', group.id)
    .order('sort_order').order('name'));

  for (const s of sections) {
    view.append(el('div', { class: 'card row spread' }, el('strong', {}, s.name),
      el('button', {
        class: 'btn danger',
        onclick: async () => {
          if (!confirmed(`${s.name} verwijderen? De leden blijven bestaan.`)) return;
          await run(async () => check(await db.from('sections').delete().eq('id', s.id)), 'Verwijderd');
          render();
        },
      }, 'Verwijderen')));
  }
}

// ---- Bakken

/**
 * Wie er samen in een boot zit. In de app kies je onder "Op het water" een bak
 * en zie je iedereen erin; hier deel je ze in, met een groter scherm en een
 * toetsenbord.
 *
 * De bemanning komt uit crew_members, die op lidmaatschap hangt, en
 * group_members geeft bij elke persoon zijn lidmaatschap mee. Zo zijn alle
 * bakken met één keer ophalen te tellen, in plaats van één verzoek per bak.
 */
async function renderBakken(view) {
  view.append(el('h2', {}, 'Bakken'));
  view.append(el('p', { class: 'dim' },
    'Een vaste bemanning voor het seizoen. In de app kies je onder "Op het water" een bak, een diploma en een eis, en zie je iedereen in die boot.'));

  const nieuw = field('Nieuwe bak', '', {});
  nieuw.input.placeholder = 'Vlet 1, Albatros, …';
  view.append(el('div', { class: 'card row' }, nieuw.wrap,
    el('button', {
      class: 'btn',
      onclick: async () => {
        if (nieuw.input.value.trim().length < 2) return;
        await run(async () => check(await db.from('crews').insert({
          group_id: group.id, name: nieuw.input.value.trim(),
        })), 'Bak toegevoegd');
        render();
      },
    }, 'Toevoegen')));

  const [crews, members, links] = await Promise.all([
    run(async () => check(await db.from('crews').select('*')
      .eq('group_id', group.id).order('sort_order').order('name'))),
    run(async () => check(await db.rpc('group_members', { p_group: group.id }))),
    run(async () => check(await db.from('crew_members').select('crew_id, membership_id'))),
  ]);

  if (!crews.length) {
    view.append(el('p', { class: 'dim' }, 'Nog geen bakken.'));
    return;
  }

  const profileOf = new Map(members.map((m) => [m.membership_id, m.profile_id]));
  for (const c of crews) {
    const aboard = new Set(
      links.filter((l) => l.crew_id === c.id).map((l) => profileOf.get(l.membership_id)),
    );
    view.append(crewCard(c, members, aboard));
  }
}

function crewCard(crew, members, aboard) {
  const card = el('div', { class: 'card' });
  const count = el('span', { class: 'dim' });
  const chosen = new Set(aboard);

  const paintCount = () => {
    count.textContent = `${chosen.size} ${chosen.size === 1 ? 'opvarende' : 'opvarenden'}`;
  };
  paintCount();

  const naam = el('input', { value: crew.name });

  card.append(el('div', { class: 'row spread' },
    el('div', { class: 'row grow' }, naam,
      el('button', {
        class: 'btn ghost',
        onclick: async () => {
          if (naam.value.trim().length < 2) return;
          await run(async () => check(await db.from('crews')
            .update({ name: naam.value.trim() }).eq('id', crew.id)), 'Naam opgeslagen');
        },
      }, 'Naam opslaan')),
    count));

  // Aanvinken en dan opslaan: een bemanning samenstellen is een handvol keuzes
  // die bij elkaar horen, en set_crew_members vervangt de hele set in één keer.
  const list = el('details', {}, el('summary', {}, 'Indelen'));
  const boxes = el('div', { style: 'margin-top:10px; columns: 2 220px; column-gap: 24px' });
  for (const m of members) {
    const box = el('input', { type: 'checkbox', style: 'width:auto; margin:0' });
    box.checked = chosen.has(m.profile_id);
    box.addEventListener('change', () => {
      if (box.checked) chosen.add(m.profile_id);
      else chosen.delete(m.profile_id);
      paintCount();
    });
    boxes.append(el('label', {
      style: 'display:flex; gap:8px; align-items:center; font-size:14px; font-weight:400; color:var(--text); margin:0 0 8px; break-inside:avoid; cursor:pointer',
    }, box, m.full_name || 'Naam nog niet ingevuld',
      m.sections?.length ? el('span', { class: 'dim' }, `· ${m.sections.join(', ')}`) : null));
  }
  list.append(boxes);
  list.append(el('div', { class: 'row', style: 'margin-top:12px' },
    el('button', {
      class: 'btn',
      onclick: async () => {
        await run(async () => check(await db.rpc('set_crew_members', {
          p_crew: crew.id, p_profiles: [...chosen],
        })), 'Indeling opgeslagen');
      },
    }, 'Indeling opslaan'),
    el('button', {
      class: 'btn danger',
      onclick: async () => {
        if (!confirmed(`${crew.name} verwijderen?\n\nDe vaarders en hun aftekeningen blijven bestaan; alleen de indeling verdwijnt.`)) return;
        await run(async () => check(await db.from('crews').delete().eq('id', crew.id)), 'Bak verwijderd');
        render();
      },
    }, 'Bak verwijderen')));

  card.append(list);
  return card;
}

// ---- Catalogus

async function renderCatalogus(view) {
  view.append(el('h2', {}, "Diploma's en eisen"));
  view.append(el('div', { class: 'note' },
    'Let op: deze lijst is gedeeld en landelijk vastgesteld. Wat je hier verandert geldt voor iedereen in deze database. ' +
    'Draai je later supabase/010-eisen.sql opnieuw, dan overschrijft die de regels die daarin staan — zet blijvende correcties dus ook in dat bestand.'));

  const [disciplines, diplomas] = await Promise.all([
    check(await db.from('disciplines').select('*').order('sort_order')),
    check(await db.from('diplomas').select('*').order('sort_order')),
  ]);

  for (const d of disciplines) {
    const box = el('div', { class: 'card' });
    const naam = field('Discipline', d.name, {});
    const sub = field('Ondertitel', d.subtitle ?? '', {});
    box.append(el('div', { class: 'row' }, naam.wrap, sub.wrap,
      el('button', {
        class: 'btn ghost',
        onclick: () => run(async () => check(await db.from('disciplines')
          .update({ name: naam.input.value, subtitle: sub.input.value || null })
          .eq('id', d.id)), 'Opgeslagen'),
      }, 'Opslaan')));

    for (const dip of diplomas.filter((x) => x.discipline_id === d.id)) {
      box.append(diplomaBlock(dip));
    }

    const nieuw = field('Nieuw diploma', '', {});
    box.append(el('details', {}, el('summary', {}, 'Diploma toevoegen'),
      el('div', { class: 'row', style: 'margin-top:10px' }, nieuw.wrap,
        el('button', {
          class: 'btn',
          onclick: async () => {
            const name = nieuw.input.value.trim();
            if (name.length < 2) return;
            await run(async () => check(await db.from('diplomas').insert({
              discipline_id: d.id, name,
              code: `${d.code}-${name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}`.slice(0, 40),
              sort_order: 99,
            })), 'Diploma toegevoegd');
            render();
          },
        }, 'Toevoegen'))));

    view.append(box);
  }
}

function diplomaBlock(dip) {
  const details = el('details', {});
  details.append(el('summary', {}, `${dip.name}${dip.level_label ? ` (${dip.level_label})` : ''}`));

  const body = el('div', { style: 'margin-top:12px' }, el('p', { class: 'dim' }, 'Bezig met laden…'));
  details.append(body);

  details.addEventListener('toggle', async () => {
    if (!details.open || details.dataset.loaded) return;
    details.dataset.loaded = '1';
    body.innerHTML = '';

    const naam = field('Naam', dip.name, {});
    const niveau = field('Niveau', dip.level_label ?? '', {});
    const bron = field('Bron', dip.source ?? '', {});
    const samenvatting = field('Omschrijving', dip.summary ?? '', { multiline: true, wrapClass: 'grow' });

    body.append(el('div', { class: 'row' }, naam.wrap, niveau.wrap, bron.wrap));
    body.append(el('div', { class: 'row', style: 'margin-top:10px' }, samenvatting.wrap));
    body.append(el('div', { class: 'row', style: 'margin-top:10px' },
      el('button', {
        class: 'btn ghost',
        onclick: () => run(async () => check(await db.from('diplomas').update({
          name: naam.input.value, level_label: niveau.input.value || null,
          source: bron.input.value || null, summary: samenvatting.input.value || null,
        }).eq('id', dip.id)), 'Opgeslagen'),
      }, 'Diploma opslaan'),
      el('button', {
        class: 'btn danger',
        onclick: async () => {
          if (!confirmed(`${dip.name} verwijderen?\n\nAlle eisen en onderdelen gaan mee. Lopen er opleidingen voor dit diploma, dan weigert de database het.`)) return;
          await run(async () => check(await db.from('diplomas').delete().eq('id', dip.id)), 'Verwijderd');
          render();
        },
      }, 'Diploma verwijderen')));

    const eisen = check(await db.from('requirements').select('*')
      .eq('diploma_id', dip.id).order('kind').order('position'));

    for (const kind of ['praktijk', 'theorie']) {
      body.append(el('h3', {}, kind === 'praktijk' ? 'Praktijk' : 'Theorie'));
      const top = eisen.filter((r) => r.kind === kind && !r.parent_id);
      for (const eis of top) {
        body.append(eisBlock(eis, eisen.filter((r) => r.parent_id === eis.id)));
      }
      body.append(nieuweEis(dip.id, kind, top.length + 1));
    }
  });

  return details;
}

function eisBlock(eis, parts) {
  const wrap = el('div', { class: 'card', style: 'background:var(--bg)' });
  const nr = field('Nr', eis.position, { wrapClass: 'num' });
  const titel = field('Eis', eis.title, {});
  const toelichting = field('Toelichting', eis.detail ?? '', { multiline: true });

  wrap.append(el('div', { class: 'row' }, nr.wrap, titel.wrap,
    el('button', {
      class: 'btn ghost',
      onclick: () => run(async () => check(await db.from('requirements').update({
        position: Number(nr.input.value), title: titel.input.value,
        detail: toelichting.input.value || null,
      }).eq('id', eis.id)), 'Opgeslagen'),
    }, 'Opslaan'),
    el('button', {
      class: 'btn danger',
      onclick: async () => {
        if (!confirmed(`Eis "${eis.title}" verwijderen?\n\nDe onderdelen én de aftekeningen die eraan hangen gaan mee.`)) return;
        await run(async () => check(await db.from('requirements').delete().eq('id', eis.id)), 'Verwijderd');
        render();
      },
    }, 'Verwijderen')));
  wrap.append(el('div', { class: 'row', style: 'margin-top:8px' }, toelichting.wrap));

  const onderdelen = el('details', {}, el('summary', {}, `${parts.length} onderdelen`));
  for (const p of parts) {
    const pt = el('input', { value: p.title });
    onderdelen.append(el('div', { class: 'part' },
      el('span', { class: 'dim' }, `${p.position}.`), pt,
      el('button', {
        class: 'btn ghost',
        onclick: () => run(async () => check(await db.from('requirements')
          .update({ title: pt.value }).eq('id', p.id)), 'Opgeslagen'),
      }, 'Opslaan'),
      el('button', {
        class: 'btn danger',
        onclick: async () => {
          if (!confirmed(`Onderdeel "${p.title}" verwijderen?`)) return;
          await run(async () => check(await db.from('requirements').delete().eq('id', p.id)), 'Verwijderd');
          render();
        },
      }, '×')));
  }

  const nieuw = el('input', { placeholder: 'Nieuw onderdeel, bijvoorbeeld: Paalsteek' });
  onderdelen.append(el('div', { class: 'part' }, nieuw,
    el('button', {
      class: 'btn',
      onclick: async () => {
        if (!nieuw.value.trim()) return;
        const position = parts.length ? Math.max(...parts.map((p) => p.position)) + 1 : 1;
        await run(async () => check(await db.from('requirements').insert({
          diploma_id: eis.diploma_id, parent_id: eis.id, kind: eis.kind,
          position, title: nieuw.value.trim(),
          code: `${eis.code}.${position}`,
        })), 'Onderdeel toegevoegd');
        render();
      },
    }, 'Toevoegen')));

  wrap.append(onderdelen);
  return wrap;
}

function nieuweEis(diplomaId, kind, position) {
  const titel = el('input', { placeholder: `Nieuwe ${kind}eis` });
  return el('div', { class: 'row', style: 'margin:8px 0 4px' }, titel,
    el('button', {
      class: 'btn',
      onclick: async () => {
        if (!titel.value.trim()) return;
        await run(async () => check(await db.from('requirements').insert({
          diploma_id: diplomaId, kind, position, title: titel.value.trim(),
          code: `eigen.${diplomaId.slice(0, 8)}.${kind[0]}${position}.${Date.now().toString(36)}`,
        })), 'Eis toegevoegd');
        render();
      },
    }, 'Toevoegen'));
}

// ---------------------------------------------------------------- start
paintAuthMode();
if (db) {
  db.auth.getSession().then(({ data }) => { if (data.session) start(); });
} else {
  document.getElementById('signin-error').textContent =
    'Geen Supabase-gegevens gevonden. Start deze pagina met "npm run admin" vanuit de projectmap.';
  document.getElementById('signin-error').classList.remove('hidden');
}
</script>
